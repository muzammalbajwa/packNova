name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Optional. Leave the secrets unset and the quote and contact forms show only the WhatsApp and email buttons.
          NEXT_PUBLIC_QUOTE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_QUOTE_ENDPOINT }}
          NEXT_PUBLIC_QUOTE_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_QUOTE_ACCESS_KEY }}

      - name: Set up SSH
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload build
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" out/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/deploy/site-upload/

      - name: Publish on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo /usr/local/bin/packnova-deploy.sh"
