<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Kraft packaging box">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#ff5b2e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff5b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b88a"/><stop offset="1" stop-color="#c9a574"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b58e5d"/><stop offset="1" stop-color="#9a763f"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d6a3a"/><stop offset="1" stop-color="#6f5028"/></linearGradient>
  </defs>
  <ellipse cx="400" cy="380" rx="360" ry="320" fill="url(#glow)"/>
  <ellipse cx="400" cy="640" rx="190" ry="30" fill="#000" opacity=".45"/>
  <!-- box body -->
  <polygon points="400,330 580,420 580,590 400,500" fill="url(#right)"/>
  <polygon points="400,330 220,420 220,590 400,500" fill="url(#left)"/>
  <!-- open flaps -->
  <polygon points="220,420 400,330 400,250 190,350" fill="#caa675" opacity=".95"/>
  <polygon points="580,420 400,330 400,250 610,350" fill="#a7824f" opacity=".95"/>
  <polygon points="220,420 400,510 580,420 400,330" fill="#2a1c0e"/>
  <polygon points="400,510 220,420 190,440 400,555" fill="url(#top)" opacity=".9"/>
  <!-- tape -->
  <polygon points="392,500 408,500 408,590 392,582" fill="#ff5b2e" opacity=".85"/>
</svg>
